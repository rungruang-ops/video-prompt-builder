name: CI

on:
  push:
    branches: [main]
  pull_request:

# least privilege: the workflow only reads the repo (no write tokens, no secrets needed)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vpb
          POSTGRES_PASSWORD: vpb
          POSTGRES_DB: vpb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vpb -d vpb_test" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://vpb:vpb@localhost:5432/vpb_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require a Redis password (like docker compose) and export the authenticated URL
        env:
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          REDIS_PASSWORD="$(openssl rand -hex 24)"; echo "::add-mask::$REDIS_PASSWORD"
          printf 'CONFIG SET requirepass %s\n' "$REDIS_PASSWORD" | docker exec -i "$REDIS_CONTAINER" redis-cli
          noauth="$(docker exec "$REDIS_CONTAINER" redis-cli ping 2>&1 || true)"; [[ "$noauth" == *NOAUTH* ]]   # unauthenticated access is refused
          echo "TEST_REDIS_URL=redis://:$REDIS_PASSWORD@localhost:6379/15" >> "$GITHUB_ENV"
      - name: Typecheck
        run: npm run typecheck
      - name: Core unit tests (shared compiler/taxonomy)
        run: npm test -w packages/core
      - name: API unit + integration tests (mocked LLM providers, real Postgres + Redis)
        run: npm test -w apps/api
      - name: Build
        run: npm run build
      - name: Dependency audit (fails on high/critical)
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vpb
          POSTGRES_PASSWORD: pgpw_${{ github.run_id }}
          POSTGRES_DB: vpb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vpb -d vpb" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: development
      DATABASE_URL: postgres://vpb:pgpw_${{ github.run_id }}@localhost:5432/vpb
      CUSTOM_LLM_BASE_URL: http://localhost:9999/v1
      CUSTOM_LLM_MODEL: stub-model
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require a Redis password (like docker compose) and export the authenticated URL
        env:
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          REDIS_PASSWORD="$(openssl rand -hex 24)"; echo "::add-mask::$REDIS_PASSWORD"
          printf 'CONFIG SET requirepass %s\n' "$REDIS_PASSWORD" | docker exec -i "$REDIS_CONTAINER" redis-cli
          noauth="$(docker exec "$REDIS_CONTAINER" redis-cli ping 2>&1 || true)"; [[ "$noauth" == *NOAUTH* ]]   # unauthenticated access is refused
          echo "REDIS_URL=redis://:$REDIS_PASSWORD@localhost:6379" >> "$GITHUB_ENV"
      - name: Generate throwaway secrets for this run
        run: |
          echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          # seeded admin for the admin e2e (the API seeds it at startup; Playwright logs in with the same values)
          ADMIN_PASSWORD="$(openssl rand -hex 16)"; echo "::add-mask::$ADMIN_PASSWORD"
          echo "ADMIN_EMAIL=e2e-admin@example.com" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run build
      - name: Start stub LLM, API and web preview
        run: |
          node tools/stub-llm/server.mjs > stub.log 2>&1 &
          node apps/api/dist/server.js > api.log 2>&1 &
          npx -w apps/web vite preview --port 5173 --strictPort > web.log 2>&1 &
          for u in http://localhost:9999/health http://localhost:8080/api/v1/health http://localhost:5173/; do
            for i in $(seq 1 60); do curl -fsS "$u" > /dev/null && break; sleep 1; done
            curl -fsS "$u" > /dev/null || { echo "not ready: $u"; exit 1; }
          done
      - name: Playwright smoke
        run: npx playwright test
        working-directory: apps/web
        env:
          BASE_URL: http://localhost:5173
      - name: Migrations via the compiled CLI (same command as Vercel build / CI deploys)
        run: npm run migrate:dist -w apps/api
      - name: Vercel adapter smoke (api/index.mjs handler + vercel.json rewrites/headers, emulated locally)
        env:
          ALLOW_STUB_LLM: "true"
          COOKIE_SECURE: "false"
          PORT: "3000"
        run: |
          node scripts/vercel-local.mjs > vercel.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/v1/health > /dev/null && break; sleep 1; done
          curl -fsSI http://localhost:3000/ | grep -i "content-security-policy"
          node scripts/smoke.mjs http://localhost:3000
      - if: failure()
        run: tail -n 200 stub.log api.log web.log vercel.log || true
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/test-results

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Generate .env (npm run env:init — random JWT/encryption/Postgres/Redis secrets) + stub LLM
        run: |
          node scripts/env-init.mjs
          sed -i -e 's#^CUSTOM_LLM_BASE_URL=.*#CUSTOM_LLM_BASE_URL=http://stub-llm:9999/v1#' -e 's#^CUSTOM_LLM_MODEL=.*#CUSTOM_LLM_MODEL=stub-model#' \
            -e 's#^ALLOW_STUB_LLM=.*#ALLOW_STUB_LLM=true#' .env
      - name: Build images and start the compose stack (production mode, stub profile)
        run: docker compose --profile stub up -d --build --wait --wait-timeout 300
      - name: Stack smoke (health, Redis requires auth, strict CSP, register → AI → versions)
        run: |
          health="$(curl -fsS http://localhost:8080/api/v1/health)"; echo "$health"
          [[ "$health" == *'"cache":{"kind":"redis","ok":true}'* ]]                 # the api authenticates to Redis
          noauth="$(docker compose exec -T redis redis-cli ping 2>&1 || true)"; echo "$noauth"
          [[ "$noauth" == *NOAUTH* ]]                                               # unauthenticated access is refused
          csp="$(curl -fsSI http://localhost:8080/)"; csp="$(grep -i '^content-security-policy:' <<< "$csp")"; echo "$csp"
          [[ "$csp" == *"style-src 'self';"* && "$csp" != *unsafe-inline* ]]
          node scripts/smoke.mjs http://localhost:8080
      - if: failure()
        run: docker compose --profile stub logs --tail 200 || true
      - if: always()
        run: docker compose --profile stub down -v || true
